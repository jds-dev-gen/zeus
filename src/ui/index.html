<!doctype html>
<html lang="pt-PT" data-zeus="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: http: crx:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Zeus</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="tl-space" id="tlSpace"></div>
    <div class="brand"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6.5L9.5 22l10-12.5h-6.5L13.5 2z" transform="rotate(14 12 12)"/></svg><span>Zeus</span></div>
    <div class="navs">
      <button class="nb" id="btnBack" type="button" aria-label="Retroceder" title="Retroceder (⌘[)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="nb" id="btnFwd" type="button" aria-label="Avançar" title="Avançar (⌘])"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="nb" id="btnReload" type="button" aria-label="Recarregar" title="Recarregar (⌘R)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    </div>
    <div class="center" id="center">
      <button class="title-btn" id="titleBtn" type="button" title="Escrever um endereço (⌘L)"></button>
      <input class="addr" id="addr" type="text" aria-label="Endereço ou pesquisa" spellcheck="false" autocomplete="off" hidden>
      <div class="top-tabs" id="topTabs" hidden></div>
    </div>
    <div class="findbox" id="findbox" hidden>
      <input id="findInput" type="text" placeholder="Procurar na página" aria-label="Procurar na página" autocomplete="off">
      <span id="findCount"></span>
      <button class="nb" id="findClose" type="button" aria-label="Fechar a pesquisa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="fullapp-btns" id="fullBtns" hidden>
      <button class="tbtn" id="fullSide" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 4v16"/></svg><span class="tx">Abrir ao lado</span></button>
      <button class="nb" id="fullClose" type="button" aria-label="Fechar a app e voltar à página"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <browser-action-list id="extActions" partition="persist:zeus" alignment="bottom left"></browser-action-list>
    <button class="tbtn on" id="updBtn" type="button" hidden></button>
    <button class="tbtn" id="mosaicBtn" type="button" title="Separadores — mantém Option premido"><span class="kbd" id="keyLbl">⌥</span><span class="tx">Separadores</span></button>
    <button class="tbtn" id="claudeBtn" type="button" title="Claude (⇧⌘K)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3.2 3.2M15.2 15.2l3.2 3.2M5.6 18.4l3.2-3.2M15.2 8.8l3.2-3.2"/></svg><span class="tx">Claude</span></button>
    <div class="wco-space" id="wcoSpace"></div>
    <div class="progress" id="progress" hidden></div>
    <div class="toast" id="toast" hidden role="status"></div>
  </header>

  <div class="main" id="main">
    <nav class="rail" id="rail" aria-label="Apps"></nav>

    <aside class="panel" id="panel" hidden aria-label="App ao lado">
      <div class="p-head">
        <h2 id="panelTitle"></h2>
        <button class="nb" id="panelFull" type="button" aria-label="Abrir em página inteira" title="Abrir sempre em página inteira"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="nb" id="panelReload" type="button" aria-label="Recarregar a app"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
        <button class="nb" id="panelClose" type="button" aria-label="Fechar a app"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="slot" id="panelSlot"><div class="slot-wait">A abrir…</div></div>
      <div class="resizer r-right" id="panelResizer" title="Arrasta para mudar a largura (duplo clique repõe)"></div>
    </aside>

    <section class="viewport" id="viewport" aria-label="Página">
      <div class="slot" id="pageSlot"></div>
      <div class="mosaic" id="mosaic" hidden role="dialog" aria-label="Separadores">
        <img class="m-bg" id="mosaicBg" alt="">
        <div class="m-veil"></div>
        <div class="m-inner">
          <div class="m-top">
            <div class="m-side"></div>
            <label class="m-search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
              <input id="mfilter" type="text" placeholder="Escreve para filtrar, ou um endereço para abrir" aria-label="Filtrar separadores ou abrir endereço" autocomplete="off" spellcheck="false">
              <small id="mcount"></small>
            </label>
            <div class="m-side m-act">
              <button class="vbtn" id="mSpace" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Espaço</button>
              <button class="vbtn solid" id="mNew" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Separador</button>
            </div>
          </div>
          <div class="zones" id="zones"></div>
          <div class="shelf" id="shelf"></div>
          <div class="keys" id="keys"></div>
        </div>
      </div>
    </section>

    <aside class="right" id="right" hidden aria-label="Separadores"></aside>

    <aside class="claude" id="claude" hidden aria-label="Claude">
      <div class="p-head">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3.2 3.2M15.2 15.2l3.2 3.2M5.6 18.4l3.2-3.2M15.2 8.8l3.2-3.2"/></svg>
        <h2>Claude</h2>
        <button class="tbtn sm" id="claudeSend" type="button" title="Enviar o texto desta página (⇧⌘J)">Enviar página</button>
        <button class="nb" id="claudeNew" type="button" aria-label="Nova conversa" title="Nova conversa"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="nb" id="claudeClose" type="button" aria-label="Fechar o Claude"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="slot" id="claudeSlot"><div class="slot-wait">A abrir o Claude…</div></div>
      <div class="resizer r-left" id="claudeResizer" title="Arrasta para mudar a largura (duplo clique repõe)"></div>
    </aside>
  </div>

  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
</div>
<script src="ui.js"></script>
</body>
</html>
