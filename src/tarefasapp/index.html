<!doctype html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Tarefas</title>
<link rel="stylesheet" href="tarefas.css">
</head>
<body>
<header class="head">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="7" height="7" rx="2"/><path d="m5.6 7.6 1.3 1.3 2.2-2.4"/><path d="M14 6h6.5M14 9h4"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><path d="M14 15.5h6.5M14 18.5h4"/></svg><h1>Tarefas</h1><small id="count"></small></div>
  <div class="seg" id="views" role="tablist"><button type="button" data-view="board" class="on">Temas</button><button type="button" data-view="list">Por data</button></div>
  <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Procurar…" autocomplete="off"></label>
  <span class="spacer"></span>
  <label class="chk"><input type="checkbox" id="showDone"> Mostrar feitas</label>
  <button class="btn" type="button" id="addArea">+ Tema</button>
  <button class="btn mg" type="button" id="mgBtn" title="Abrir o MacGyver (⇧⌘M) — pede-lhe para criar, arrumar ou trazer tarefas do Apolo"><span class="dot"></span>MacGyver</button>
</header>
<main class="stage" id="stage"></main>
<aside class="drawer" id="drawer" hidden></aside>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="tarefas.js"></script>
</body>
</html>
