<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https: http: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Radar</title>
<link rel="stylesheet" href="radar.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18.4 5.6"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
    <h1>Radar</h1>
  </div>
  <label class="q">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Procurar notícias sobre um tema…" autocomplete="off" spellcheck="false" aria-label="Procurar notícias">
    <button type="button" id="qClear" class="q-x" aria-label="Limpar a pesquisa" hidden>✕</button>
  </label>
  <span class="status" id="status">A carregar…</span>
  <div class="actions">
    <label class="toggle" title="Esconder as notícias que já abriste"><input type="checkbox" id="unreadOnly"> Só por ler</label>
    <button class="btn" id="refresh" type="button" title="Atualizar agora (⌘R)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      Atualizar
    </button>
  </div>
</header>
<main class="cols" id="cols"></main>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="m-head">
      <h2 id="mTitle">Fontes</h2>
      <button class="icon" type="button" id="mClose" aria-label="Fechar">✕</button>
    </div>
    <div class="m-body">
      <section>
        <span class="lbl">Fontes desta coluna</span>
        <ul class="srcs" id="mSources"></ul>
      </section>
      <section>
        <span class="lbl">Procurar fonte</span>
        <form class="search" id="mSearch">
          <input id="mQuery" type="text" placeholder="Nome do site ou endereço (ex.: publico.pt, The Verge)" autocomplete="off" spellcheck="false">
          <button class="btn primary" type="submit">Procurar</button>
        </form>
        <ul class="results" id="mResults"></ul>
      </section>
      <section id="mSuggestWrap">
        <span class="lbl">Sugestões</span>
        <ul class="results" id="mSuggest"></ul>
      </section>
    </div>
  </div>
</div>
<script src="radar.js"></script>
</body>
</html>
