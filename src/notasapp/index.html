<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https: http: data:; media-src file: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Notas</title>
<link rel="stylesheet" href="notas.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h9.5L19 9v10.5H5z"/><path d="M14.5 4.5V9H19"/><path d="M8.5 13h7M8.5 16.2h4.5"/></svg>
    <h1>Notas</h1>
  </div>
  <label class="q">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Procurar nas notas…" autocomplete="off" spellcheck="false" aria-label="Procurar nas notas">
  </label>
  <div class="recbar" id="recbar" hidden>
    <span class="recdot"></span>
    <span class="rectime" id="recTime">00:00</span>
    <span class="meter"><i id="recLevel"></i></span>
    <span class="recnote" id="recNote"></span>
    <button class="btn small" type="button" id="recPause">Pausar</button>
    <button class="btn small primary" type="button" id="recStop">Parar e transcrever</button>
    <button class="icon" type="button" id="recCancel" title="Cancelar a gravação">✕</button>
  </div>
  <div class="right" id="topRight">
    <span class="sync" id="sync"></span>
    <button class="btn" type="button" id="recMeeting" title="Grava a reunião pelo microfone e transcreve-a no Mac"><span class="rd"></span>Gravar reunião</button>
    <button class="btn primary" type="button" id="newNote" title="Nova nota (⌘N)">+ Nova nota</button>
  </div>
</header>
<div class="reminder" id="recReminder" hidden>Lembrete: avise os participantes de que a reunião está a ser gravada. <button type="button" id="recReminderX">OK</button></div>

<div class="stage" id="stage">
  <aside class="side" id="side"></aside>
  <section class="list" id="list"></section>
  <section class="ed" id="ed">
    <div class="tools" id="tools">
      <button class="size" type="button" id="tSize" title="Tamanho da letra"><span id="tSizeV">16</span> px <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="sep"></span>
      <button class="t" type="button" data-cmd="h1" title="Título grande (# e espaço)" style="font-weight:700;font-size:15px">H1</button>
      <button class="t" type="button" data-cmd="h2" title="Título médio (## e espaço)" style="font-weight:700;font-size:13.5px">H2</button>
      <button class="t" type="button" data-cmd="h3" title="Título pequeno (### e espaço)" style="font-weight:700;font-size:12px">H3</button>
      <span class="sep"></span>
      <button class="t" type="button" data-cmd="bold" title="Negrito (⌘B)" style="font-weight:800">B</button>
      <button class="t" type="button" data-cmd="italic" title="Itálico (⌘I)" style="font-style:italic;font-family:Georgia,serif">I</button>
      <button class="t" type="button" data-cmd="underline" title="Sublinhado (⌘U)" style="text-decoration:underline">U</button>
      <button class="t" type="button" data-cmd="strikeThrough" title="Riscado" style="text-decoration:line-through">S</button>
      <button class="t sw" type="button" id="tColor" title="Cor do texto">A<i id="tColorBar" style="background:#c62828"></i></button>
      <button class="t sw" type="button" id="tHl" title="Destacar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h8"/></svg><i id="tHlBar" style="background:#fff1a6"></i></button>
      <button class="t" type="button" data-cmd="clear" title="Limpar a formatação"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 5h12M10 5l-3 14M14 5l-1.2 5.6"/><path d="M15 15l5 5M20 15l-5 5"/></svg></button>
      <span class="sep"></span>
      <button class="t" type="button" data-cmd="ul" title="Lista">• —</button>
      <button class="t" type="button" data-cmd="ol" title="Lista numerada">1.</button>
      <button class="t" type="button" data-cmd="todo" title="Lista de tarefas">☑</button>
      <button class="t" type="button" data-cmd="quote" title="Citação">❝</button>
      <button class="t" type="button" id="tLink" title="Ligação (⌘K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></button>
      <span class="sep"></span>
      <button class="t" type="button" id="tZoom" title="Inserir um destaque do Zoom"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M14 14l5.5 5.5"/></svg></button>
      <button class="t" type="button" id="tMic" title="Gravar a reunião para esta nota"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <span class="spacer"></span>
      <button class="t" type="button" id="mFocus" title="Modo foco: só o texto (Esc para sair)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
      <button class="t" type="button" id="tMore" title="Mais opções">⋯</button>
    </div>
    <div class="jobbar" id="jobbar" hidden></div>
    <div class="page" id="page">
      <div class="docwrap">
        <div class="meta" id="meta"></div>
        <textarea class="title" id="title" placeholder="Título" rows="1" spellcheck="true"></textarea>
        <div class="doc" id="doc" contenteditable="true" spellcheck="true" lang="pt-PT"></div>
      </div>
      <div class="empty" id="empty" hidden></div>
      <div class="trashv" id="trashv" hidden></div>
    </div>
    <div class="player" id="player" hidden><span>Gravação</span><audio id="audio" controls preload="metadata"></audio></div>
    <div class="status" id="status"><span id="words"></span><span class="spacer"></span><span id="saved"></span></div>
  </section>
</div>

<div class="pop" id="pop" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="notas.js"></script>
</body>
</html>
