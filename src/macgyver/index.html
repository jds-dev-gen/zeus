<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>MacGyver</title>
<link rel="stylesheet" href="mg.css">
</head>
<body>
<div class="panel" id="panel" hidden>
  <header class="ph">
    <span class="mini"><canvas class="oc" width="96" height="96"></canvas></span>
    <div class="pt"><h2>MacGyver</h2><small id="sub"></small></div>
    <button class="ib" type="button" id="setBtn" title="Definições" aria-label="Definições"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="ib" type="button" id="closeBtn" title="Fechar (Esc)" aria-label="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="main" id="main">
    <nav class="tabs" id="tabs"><button type="button" data-tab="today" class="on">Hoje</button><button type="button" data-tab="next">Próximos dias</button><button type="button" data-tab="all">Tudo</button></nav>
    <div class="list" id="list"></div>
    <div class="chat" id="chat"></div>
    <div class="inp">
      <div class="field">
        <button class="ctx" type="button" id="ctx" hidden title="O MacGyver pode ver a página aberta. Carrega para desligar nesta mensagem."></button>
        <textarea id="q" rows="1" placeholder="Escreve, ou carrega no micro…" spellcheck="true"></textarea>
      </div>
      <button class="mic" type="button" id="mic" title="Falar (⌥ Espaço)" aria-label="Falar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
  </div>
  <div class="settings" id="settings" hidden></div>
</div>
<div class="bubble" id="bubble" hidden></div>
<button class="orb" type="button" id="orb" aria-label="MacGyver" title="MacGyver — carrega para abrir · ⌥ Espaço para falar"><canvas class="oc big" width="232" height="232"></canvas><span class="badge" id="badge" hidden></span></button>
<script src="orb.js"></script>
<script src="mg.js"></script>
</body>
</html>
