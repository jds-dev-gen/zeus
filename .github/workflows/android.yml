# Zeus para Android: compila o .apk e publica-o como versão "android-v<versão>".
#
# Quando corre: sempre que muda alguma coisa em android/ (ou o núcleo do Zoom, src/zoom-core.js)
# no ramo main, ou à mão no separador Actions ("Run workflow").
# A versão está em android/version.txt. Uma versão só é publicada uma vez.
# As versões Android são publicadas sem passarem a "Latest", para não baralharem as
# atualizações do Zeus do Mac (que procura /releases/latest).
#
# Segredos do repositório (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE           — a chave de assinatura (.jks) em base64
#   ANDROID_KEYSTORE_PASSWORD  — a palavra-passe dela
# Sem eles, compila na mesma (para ver se não há erros) mas não publica.
name: Zeus Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'src/zoom-core.js', 'src/notas-core.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ficheiros partilhados com o Zeus do Mac
        run: |
          cp src/zoom-core.js android/app/src/main/assets/app/zoom-core.js
          cp src/notas-core.js android/app/src/main/assets/app/notas-core.js
          mkdir -p android/app/src/main/assets/app/fonts
          cp src/ui/fonts/Geist-Variable.woff2 android/app/src/main/assets/app/fonts/

      - name: Chave de assinatura
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/zeus.jks"
            echo "ZEUS_KEYSTORE=$RUNNER_TEMP/zeus.jks" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem a chave (segredo ANDROID_KEYSTORE): compila sem assinar e não publica."
          fi

      - name: Compilar
        env:
          ZEUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publicar a versão
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat android/version.txt | tr -d '[:space:]')
          if gh release view "android-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A versão Android $V já existe; nada a fazer."
            exit 0
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "Zeus-$V.apk"
          sha256sum "Zeus-$V.apk" > SHA256SUMS-android.txt
          gh release create "android-v$V" "Zeus-$V.apk" SHA256SUMS-android.txt \
            --repo "$GITHUB_REPOSITORY" --title "Zeus para Android $V" --latest=false \
            --notes "Zeus para o tablet. No tablet: descarregar Zeus-$V.apk e abrir (instalar / atualizar)."

      - name: Guardar o .apk de teste
        if: steps.key.outputs.ok != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: zeus-android-sem-assinatura
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
