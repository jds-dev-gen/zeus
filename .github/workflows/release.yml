# Publica versões novas do Zeus para Mac.
#
# Quando corre:
#  - sempre que a versão em package.json muda no ramo main (ex.: depois de uma alteração feita com o Claude);
#  - todas as segundas-feiras, para trazer as correções de segurança do Electron/Chromium;
#  - à mão, no separador Actions do GitHub ("Run workflow").
# O Zeus instalado procura estas versões sozinho e instala-as ao reiniciar.
name: Zeus — versões

on:
  push:
    branches: [main]
    paths: [package.json]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Correções de segurança do Electron
        id: bump
        if: github.event_name != 'push'
        run: node scripts/bump-electron.js

      - name: Gravar a atualização do Electron
        if: steps.bump.outputs.changed == 'true'
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name "zeus-bot"
          git config user.email "zeus-bot@users.noreply.github.com"
          git commit -am "Electron ${{ steps.bump.outputs.electron }} (correções de segurança) — Zeus ${{ steps.bump.outputs.version }}"
          git push

      - name: Ver se esta versão já foi publicada
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "A versão $V já existe; nada a fazer."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  compilar:
    needs: preparar
    if: needs.preparar.outputs.publicar == 'true'
    # as duas versões (Apple Silicon e Intel) compilam na mesma máquina (macOS 15; o macOS 14 foi retirado em nov 2026): basta haver um Mac livre no GitHub
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Whisper (whisper.cpp): transcreve as reuniões gravadas nas Notas, no próprio Mac.
      # Compila-se aqui, para Apple Silicon (com Metal, a parte gráfica do M1) e para Intel; vai dentro da app.
      - name: Whisper (transcrição no Mac)
        run: |
          git clone --quiet --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          for A in arm64 x86_64; do
            if [ "$A" = arm64 ]; then D=arm64; EXTRA="-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON"; else D=x64; EXTRA="-DGGML_METAL=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"; fi
            cmake -S /tmp/whisper.cpp -B /tmp/wb-$A -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$A -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF $EXTRA
            cmake --build /tmp/wb-$A --config Release -j 4 --target whisper-cli
            mkdir -p vendor/whisper-darwin-$D/whisper
            cp /tmp/wb-$A/bin/whisper-cli vendor/whisper-darwin-$D/whisper/
            file vendor/whisper-darwin-$D/whisper/whisper-cli
            otool -L vendor/whisper-darwin-$D/whisper/whisper-cli
          done
          # prova rápida (com o modelo de testes do whisper.cpp, sem a parte gráfica: as máquinas do GitHub não a têm)
          vendor/whisper-darwin-arm64/whisper/whisper-cli -m /tmp/whisper.cpp/models/for-tests-ggml-tiny.bin -f /tmp/whisper.cpp/samples/jfk.wav -l pt -ng -oj -of /tmp/prova -pp
          test -s /tmp/prova.json && echo "Whisper OK"
      # ffmpeg (Orfeu): lê e converte todos os formatos de áudio e vídeo, corta excertos, extrai o áudio.
      # Binários estáticos para Mac (projeto ffmpeg-static), verificados pela soma SHA-256.
      - name: ffmpeg (Orfeu)
        run: |
          for A in arm64 x64; do curl -sSL --fail -o /tmp/ff-$A.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-$A.gz; done
          echo "8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa  /tmp/ff-arm64.gz" | shasum -a 256 -c
          echo "929b375c1182d956c51f7ac25e0b2b0411fb01f6f407aa15c9758efeb4242106  /tmp/ff-x64.gz" | shasum -a 256 -c
          for A in arm64 x64; do
            mkdir -p vendor/ffmpeg-darwin-$A/ffmpeg
            gunzip -c /tmp/ff-$A.gz > vendor/ffmpeg-darwin-$A/ffmpeg/ffmpeg
            chmod +x vendor/ffmpeg-darwin-$A/ffmpeg/ffmpeg
            file vendor/ffmpeg-darwin-$A/ffmpeg/ffmpeg
            otool -L vendor/ffmpeg-darwin-$A/ffmpeg/ffmpeg
          done
          vendor/ffmpeg-darwin-arm64/ffmpeg/ffmpeg -hide_banner -version | head -1
          vendor/ffmpeg-darwin-arm64/ffmpeg/ffmpeg -hide_banner -f lavfi -i sine=d=1 -c:a aac /tmp/prova.m4a && test -s /tmp/prova.m4a && echo "ffmpeg OK"
      - name: Empacotar e assinar (ad-hoc)
        run: |
          node package-mac.js arm64
          node package-mac.js x64
      - name: Comprimir
        run: |
          V=${{ needs.preparar.outputs.version }}
          for A in arm64 x64; do
            ditto -c -k --keepParent "out/Zeus-darwin-$A/Zeus.app" "Zeus-$V-mac-$A.zip"
          done
          ls -la Zeus-*.zip
      - uses: actions/upload-artifact@v5
        with:
          name: zeus-mac
          path: Zeus-*.zip
          retention-days: 3

  publicar:
    needs: [preparar, compilar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Somas de verificação
        working-directory: dist
        run: sha256sum Zeus-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.preparar.outputs.version }}
          gh release create "v$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.preparar.outputs.ref }}" \
            --title "Zeus $V" \
            --notes "Versão $V do Zeus para Mac. O Zeus instalado descarrega-a sozinho e instala-a ao reiniciar."
